apiVersion: v1
kind: ServiceAccount
metadata:
  name: leader-sa

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-role
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leader-role
subjects:
  - kind: ServiceAccount
    name: leader-sa
