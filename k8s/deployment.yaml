apiVersion: apps/v1
kind: Deployment
metadata:
  name: leader-demo
  labels:
    app: leader-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: leader-demo
  template:
    metadata:
      labels:
        app: leader-demo
    spec:
      serviceAccountName: leader-sa
      containers:
        - name: leader-demo
          image: leader-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPRING_CLOUD_KUBERNETES_CLIENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
